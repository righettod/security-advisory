name: Validate advisories files
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions: read-all    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@v6
      - name: Install the system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y file pdfgrep dos2unix jq
      - name: Validate the PDF files
        run: |
          dos2unix validate.sh
          chmod +x validate.sh
          bash validate.sh
